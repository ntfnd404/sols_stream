name: action_bloc
description: >-
  Typed one-shot side effects for flutter_bloc — navigation, SnackBars and
  dialogs delivered via a fire-and-forget action stream outside BLoC state.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
    
  flutter_bloc: ^9.1.0
  nested: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
