  solana_wallet:
    path: packages/solana_wallet
  ui_kit:
    path: packages/ui_kit
  signaling:
    path: packages/signaling

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
