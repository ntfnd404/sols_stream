publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

workspace:
  - packages/action_bloc
  - packages/secure_storage
  - packages/signaling
  - packages/solana_wallet
  - packages/ui_kit

dependencies:
  flutter:
    sdk: flutter
    
  flutter_webrtc: 1.4.1
  video_player: 2.11.1
  qr_flutter: 4.1.0
